<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Do It — MORNING BRIEF v2</title>
<style>
:root{--bg:#FFFFFF;--stage:#F2F2F7;--inset:#F2F2F7;--inset-2:#EAEAEF;--card:#FFFFFF;--ink:#000;--ink-2:#1C1C1E;--label:#8E8E93;--label-2:#6E6E73;--hairline:rgba(60,60,67,0.10);--hairline-2:rgba(60,60,67,0.06);--blue:#007AFF;--blue-soft:rgba(0,122,255,0.10);--shadow-press:0 1px 0 rgba(255,255,255,0.08) inset,0 0 0 0.5px rgba(0,0,0,0.5),0 12px 24px -14px rgba(10,10,20,0.45)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
html,body{background:var(--stage);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;color:var(--ink)}
body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:48px 36px 96px;gap:48px;flex-wrap:wrap;background:radial-gradient(60% 40% at 50% 0%,#F7F7FB 0%,var(--stage) 60%)}
.col{display:flex;flex-direction:column;align-items:center;gap:14px}
.col-label{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--label);font-weight:600}
.phone{width:393px;height:852px;background:var(--bg);border-radius:52px;position:relative;overflow:hidden;box-shadow:0 0 0 0.5px rgba(0,0,0,0.06),0 30px 60px -25px rgba(20,20,30,0.22)}

/* TODAY skeleton behind */
.today-bg{position:absolute;inset:0;background:var(--stage);z-index:1}
.today-bg .top{height:90px;background:var(--bg);box-shadow:0 0.5px 0 var(--hairline)}
.today-bg .row{height:64px;background:var(--card);border-radius:18px;margin:10px 20px;box-shadow:0 0 0 0.5px rgba(60,60,67,0.05)}
.today-bg .row:first-of-type{margin-top:80px}

.scrim{position:absolute;inset:0;background:rgba(20,20,30,0.42);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);z-index:2}

.modal{position:absolute;top:120px;left:20px;right:20px;background:#fff;border-radius:24px;box-shadow:0 0 0 0.5px rgba(0,0,0,0.06),0 32px 64px -20px rgba(20,20,30,0.40);z-index:3;padding:22px 22px 18px}
.lbl{font-size:10px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--label);margin-bottom:6px}
.morning-h{font-size:24px;font-weight:800;letter-spacing:-0.035em;line-height:1.1;color:var(--ink);margin-bottom:6px}
.morning-sub{font-size:13px;color:var(--label-2);font-weight:500;letter-spacing:-0.005em;margin-bottom:18px;line-height:1.4}

.q-block{margin-bottom:14px;padding:14px 14px 12px;background:var(--inset);border-radius:16px;box-shadow:inset 0 0 0 0.5px var(--hairline-2)}
.q-block .qh{font-size:13.5px;font-weight:700;color:var(--ink);letter-spacing:-0.012em;line-height:1.3;margin-bottom:8px}
.q-block textarea{width:100%;background:#fff;border:none;border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink);font-family:inherit;resize:none;min-height:48px;outline:none;letter-spacing:-0.005em;box-shadow:inset 0 0 0 0.5px var(--hairline)}
.q-block textarea::placeholder{color:var(--label);font-style:italic}
.q-block .typed{font-size:14px;color:var(--ink);font-weight:600;letter-spacing:-0.005em;line-height:1.45}

.cta{width:100%;background:linear-gradient(180deg,#1A1A20 0%,#000 100%);color:#fff;border:none;border-radius:14px;padding:14px;font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer;box-shadow:var(--shadow-press);margin-top:6px}
.skip{display:block;margin:10px auto 0;background:transparent;border:none;color:var(--label);font-size:12px;font-weight:500;font-family:inherit;cursor:pointer}
</style></head><body>

<div class="col">
  <div class="col-label">Mobile · morning brief overlay on TODAY</div>
  <div class="phone">
    <div class="today-bg">
      <div class="top"></div>
      <div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div>
    </div>
    <div class="scrim"></div>
    <div class="modal">
      <div class="lbl">morning brief · 4:30am</div>
      <div class="morning-h">11 blocks today.<br/>where could it bend?</div>
      <div class="morning-sub">two prompts. answer plain. shapes the rest.</div>

      <div class="q-block">
        <div class="qh">what's likely to push back today?</div>
        <textarea placeholder="the 2pm calls might run long..."></textarea>
      </div>

      <div class="q-block">
        <div class="qh">if it breaks down, you resume by ___.</div>
        <textarea placeholder="walking · 5 min · then back to the brief."></textarea>
      </div>

      <button class="cta">good. start today.</button>
      <button class="skip">skip this morning</button>
    </div>
  </div>
</div>

</body></html>
