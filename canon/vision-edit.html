<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Do It — VISION EDIT · Webuild</title>
<style>
  :root{
    --bg:#FFFFFF;
    --stage:#F2F2F7;
    --stage-2:#E9E9EE;
    --inset:#F2F2F7;
    --inset-2:#EAEAEF;
    --card:#FFFFFF;

    --ink:#000000;
    --ink-2:#1C1C1E;
    --ink-3:#3A3A3C;
    --label:#8E8E93;
    --label-2:#6E6E73;
    --glyph:#0A0A0F;

    --hairline:rgba(60,60,67,0.10);
    --hairline-2:rgba(60,60,67,0.06);
    --hairline-strong:rgba(60,60,67,0.18);

    --blue:#007AFF;
    --red:#FF453A;

    /* domain tints — locked across app */
    --t-business-1:#E1ECFF; --t-business-2:#C9DBFF;
    --t-religion-1:#E2F4E6; --t-religion-2:#C0E5C8;
    --t-learning-1:#FFE3EB; --t-learning-2:#FFCFDC;
    --t-fitness-1:#FFD0DA;  --t-fitness-2:#FFB6C5;
    --t-home-1:#E5ECF0;     --t-home-2:#CFDCE3;

    --shadow-card:
      0 0 0 0.5px rgba(60,60,67,0.06),
      0 1px 1px rgba(20,20,30,0.02),
      0 12px 28px -14px rgba(20,20,30,0.10),
      0 26px 50px -28px rgba(20,20,30,0.14);
    --shadow-row:
      0 0 0 0.5px rgba(60,60,67,0.05),
      0 1px 1px rgba(20,20,30,0.02),
      0 6px 16px -12px rgba(20,20,30,0.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
  html,body{
    background:var(--stage);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
    color:var(--ink);
    text-rendering:optimizeLegibility;
  }
  body{
    min-height:100vh;
    display:flex;align-items:flex-start;justify-content:center;
    padding:64px 40px 96px;
    background:radial-gradient(60% 40% at 50% 0%, #F7F7FB 0%, var(--stage) 60%);
  }

  /* phone shell */
  .phone{
    width:393px;height:852px;
    background:var(--bg);
    border-radius:52px;
    position:relative;overflow:hidden;
    box-shadow:
      0 0 0 0.5px rgba(0,0,0,0.06),
      0 1px 0 rgba(255,255,255,0.6) inset,
      0 30px 60px -25px rgba(20,20,30,0.22),
      0 12px 24px -10px rgba(20,20,30,0.10);
  }
  .screen{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    padding:54px 0 0;
    background:var(--stage);
  }

  /* ───── topbar — back + title + cancel ───── */
  .topbar{
    position:relative;z-index:4;
    display:flex;align-items:center;gap:10px;
    padding:0 20px;margin-bottom:6px;
    height:42px;
  }
  .back{
    width:34px;height:34px;border-radius:50%;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    box-shadow:
      inset 0 0 0 0.5px var(--hairline-2),
      0 1px 2px rgba(20,20,30,0.05);
    cursor:pointer;
  }
  .back svg{width:11px;height:11px;stroke:var(--ink-2);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none;}
  .top-title{
    font-size:11px;font-weight:700;color:var(--label);
    letter-spacing:0.16em;text-transform:uppercase;
    flex:1;text-align:center;
    margin-left:-34px; /* visual centering against back btn */
  }
  .cancel-link{
    font-size:14px;font-weight:500;color:var(--label-2);
    letter-spacing:-0.018em;
    background:none;border:0;cursor:pointer;padding:8px 4px;
  }

  /* ───── scroll body ───── */
  .scroll{
    position:relative;z-index:2;
    flex:1;overflow-y:auto;
    padding:6px 20px 130px;
    -webkit-mask-image:linear-gradient(180deg, #000 0%, #000 94%, transparent 100%);
            mask-image:linear-gradient(180deg, #000 0%, #000 94%, transparent 100%);
  }
  .scroll::-webkit-scrollbar{display:none;}

  /* ───── PREVIEW TILE — mirrors visions hero card ───── */
  .preview-eyebrow{
    display:flex;align-items:center;gap:8px;
    padding:0 6px;margin:8px 0 10px;
  }
  .preview-eyebrow .lbl{
    font-size:10px;font-weight:700;color:var(--label);
    letter-spacing:0.16em;text-transform:uppercase;
  }
  .preview-eyebrow .rule{flex:1;height:1px;background:var(--hairline-2);}
  .preview-eyebrow .meta{
    font-size:10px;font-weight:700;color:var(--label-2);
    letter-spacing:0.10em;text-transform:uppercase;
  }
  .preview-eyebrow .meta .dot{
    display:inline-block;width:5px;height:5px;border-radius:50%;
    background:#34C759;margin-right:5px;vertical-align:middle;
    box-shadow:0 0 0 2px rgba(52,199,89,0.15);
  }

  .preview-tile{
    position:relative;
    border-radius:24px;
    padding:18px 18px 18px;
    margin-bottom:24px;
    background:var(--card);
    box-shadow:var(--shadow-card);
    overflow:hidden;
    isolation:isolate;
    min-height:158px;
    display:flex;flex-direction:column;justify-content:flex-end;
  }
  .preview-tile::before{
    content:"";position:absolute;inset:0;border-radius:24px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.95), inset 0 0 0 0.5px rgba(60,60,67,0.05);
    pointer-events:none;z-index:2;
  }
  .preview-tile .aura{
    position:absolute;
    right:-80px;top:-90px;
    width:420px;height:340px;
    border-radius:50%;
    filter:blur(36px);
    opacity:0.85;
    z-index:0;pointer-events:none;
    background:radial-gradient(closest-side,
      rgba(201,219,255,0.95),
      rgba(225,236,255,0.65) 50%,
      transparent 78%);
    transition:background .25s ease;
  }
  .preview-tile .aura-2{
    position:absolute;
    left:-60px;bottom:-80px;
    width:280px;height:220px;
    border-radius:50%;
    filter:blur(38px);
    opacity:0.5;
    z-index:0;pointer-events:none;
    background:radial-gradient(closest-side,
      rgba(225,236,255,0.95),
      rgba(225,236,255,0.5) 55%,
      transparent 78%);
  }
  .preview-top{
    position:relative;z-index:3;
    display:flex;align-items:center;gap:10px;
    margin-bottom:48px;
  }
  .preview-pin{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 8px 4px 7px;
    background:rgba(255,255,255,0.7);
    border-radius:999px;
    box-shadow:inset 0 0 0 0.5px var(--hairline);
    font-size:9.5px;font-weight:700;color:var(--ink-2);
    letter-spacing:0.10em;text-transform:uppercase;
  }
  .preview-pin svg{width:9px;height:9px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .live-tag{
    margin-left:auto;
    font-size:9px;font-weight:700;color:var(--label);
    letter-spacing:0.18em;text-transform:uppercase;
    display:inline-flex;align-items:center;gap:5px;
  }
  .live-tag .pulse{
    width:5px;height:5px;border-radius:50%;
    background:#34C759;
    box-shadow:0 0 0 2px rgba(52,199,89,0.18);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 2px rgba(52,199,89,0.18);}
    50%{box-shadow:0 0 0 5px rgba(52,199,89,0);}
  }

  .preview-body{
    position:relative;z-index:3;
    display:flex;align-items:flex-end;gap:14px;
  }
  .preview-tile .ddisc{
    width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    background:linear-gradient(180deg,var(--t-business-1) 0%, var(--t-business-2) 100%);
    box-shadow:
      inset 0 0 0 0.5px rgba(20,20,30,0.06),
      inset 0 -2px 4px rgba(20,20,30,0.04),
      0 1px 2px rgba(20,20,30,0.04);
    transition:background .25s ease;
  }
  .preview-tile .ddisc svg{width:24px;height:24px;color:var(--glyph);stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;}
  .preview-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .preview-title{
    font-size:22px;font-weight:700;color:var(--ink);
    letter-spacing:-0.038em;line-height:1.05;
  }
  .preview-tag{
    font-size:13px;font-weight:500;color:var(--label-2);
    letter-spacing:-0.012em;line-height:1.25;
  }

  /* ───── field labels ───── */
  .field-label{
    font-size:10.5px;font-weight:700;color:var(--label);
    letter-spacing:0.14em;text-transform:uppercase;
    padding:0 4px;margin:18px 0 8px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .field-label .hint{
    font-size:10.5px;font-weight:600;color:var(--label-2);
    letter-spacing:0.005em;text-transform:none;
  }
  .field-label .hint .num{
    color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums;
  }

  /* ───── title field — large ───── */
  .title-field{
    background:#fff;border-radius:16px;
    padding:14px 18px;
    box-shadow:var(--shadow-row);
    display:flex;align-items:center;gap:10px;
    position:relative;
  }
  .title-field::before{
    content:"";position:absolute;inset:0;border-radius:16px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.95), inset 0 0 0 0.5px rgba(60,60,67,0.06);
    pointer-events:none;
  }
  .title-field input{
    flex:1;background:transparent;border:0;outline:0;
    font:inherit;
    font-size:22px;font-weight:700;color:var(--ink);
    letter-spacing:-0.035em;line-height:1.1;
  }
  .title-field input::placeholder{color:var(--label);font-weight:600;letter-spacing:-0.030em;}
  .title-field .caret{
    width:1.8px;height:24px;background:var(--blue);
    animation:blink 1.05s steps(2) infinite;
    border-radius:2px;
    margin-bottom:-2px;
  }
  @keyframes blink{50%{opacity:0;}}

  /* ───── tagline field ───── */
  .tag-field{
    background:#fff;border-radius:14px;
    padding:12px 16px;
    box-shadow:var(--shadow-row);
    position:relative;
  }
  .tag-field::before{
    content:"";position:absolute;inset:0;border-radius:14px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.95), inset 0 0 0 0.5px rgba(60,60,67,0.06);
    pointer-events:none;
  }
  .tag-field input{
    width:100%;background:transparent;border:0;outline:0;
    font:inherit;
    font-size:14px;font-weight:500;color:var(--ink-2);
    letter-spacing:-0.014em;line-height:1.3;
  }
  .tag-field input::placeholder{color:var(--label);font-weight:500;}

  /* ───── domain picker — 5 disc chips, horizontal ───── */
  .domain-row{
    display:flex;gap:8px;
    background:transparent;
  }
  .dchip{
    flex:1;
    background:#fff;
    border-radius:16px;
    padding:11px 6px 9px;
    box-shadow:var(--shadow-row);
    display:flex;flex-direction:column;align-items:center;gap:6px;
    cursor:pointer;
    position:relative;
    transition:transform .12s ease;
  }
  .dchip::before{
    content:"";position:absolute;inset:0;border-radius:16px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.95), inset 0 0 0 0.5px rgba(60,60,67,0.06);
    pointer-events:none;
  }
  .dchip .ddot{
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    box-shadow:
      inset 0 0 0 0.5px rgba(20,20,30,0.06),
      inset 0 -2px 4px rgba(20,20,30,0.04),
      0 1px 2px rgba(20,20,30,0.04);
  }
  .dchip .ddot svg{width:14px;height:14px;color:var(--glyph);stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;}
  .dchip .dname{
    font-size:9.5px;font-weight:700;color:var(--label-2);
    letter-spacing:0.06em;text-transform:uppercase;line-height:1;
  }
  .dchip.business .ddot{background:linear-gradient(180deg,var(--t-business-1) 0%, var(--t-business-2) 100%);}
  .dchip.religion .ddot{background:linear-gradient(180deg,var(--t-religion-1) 0%, var(--t-religion-2) 100%);}
  .dchip.learning .ddot{background:linear-gradient(180deg,var(--t-learning-1) 0%, var(--t-learning-2) 100%);}
  .dchip.fitness  .ddot{background:linear-gradient(180deg,var(--t-fitness-1) 0%, var(--t-fitness-2) 100%);}
  .dchip.home     .ddot{background:linear-gradient(180deg,var(--t-home-1) 0%, var(--t-home-2) 100%);}

  .dchip.selected{
    box-shadow:
      0 0 0 1.5px var(--ink-2),
      0 1px 1px rgba(20,20,30,0.02),
      0 6px 16px -12px rgba(20,20,30,0.10);
  }
  .dchip.selected .dname{color:var(--ink);}
  .dchip.selected::after{
    content:"";position:absolute;top:6px;right:6px;
    width:10px;height:10px;border-radius:50%;
    background:var(--ink);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12l5 5 9-11'/></svg>");
    background-size:8px 8px;background-position:center;background-repeat:no-repeat;
  }

  /* ───── description — multiline soft ───── */
  .desc-field{
    background:#fff;border-radius:18px;
    padding:14px 16px 12px;
    box-shadow:var(--shadow-row);
    position:relative;
  }
  .desc-field::before{
    content:"";position:absolute;inset:0;border-radius:18px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.95), inset 0 0 0 0.5px rgba(60,60,67,0.06);
    pointer-events:none;
  }
  .desc-field textarea{
    width:100%;background:transparent;border:0;outline:0;resize:none;
    font:inherit;
    font-size:14px;font-weight:450;color:var(--ink-2);
    letter-spacing:-0.012em;line-height:1.5;
    min-height:118px;
  }
  .desc-field textarea::placeholder{color:var(--label);}
  .desc-field .meter{
    margin-top:8px;display:flex;align-items:center;justify-content:flex-end;
    font-size:10px;font-weight:600;color:var(--label);letter-spacing:0.04em;
  }
  .desc-field .meter .num{color:var(--ink-3);font-weight:700;font-variant-numeric:tabular-nums;}

  /* ───── threads builder ───── */
  .threads-list{
    background:#fff;
    border-radius:18px;
    box-shadow:var(--shadow-row);
    overflow:hidden;position:relative;
  }
  .threads-list::before{
    content:"";position:absolute;inset:0;border-radius:18px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.95), inset 0 0 0 0.5px rgba(60,60,67,0.06);
    pointer-events:none;z-index:2;
  }
  .thread-row{
    position:relative;
    display:flex;align-items:center;gap:10px;
    padding:10px 12px 10px 10px;
  }
  .thread-row + .thread-row::before{
    content:"";position:absolute;left:50px;right:12px;top:0;
    height:0.5px;background:var(--hairline-2);
  }
  .grip{
    width:18px;height:30px;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;color:rgba(60,60,67,0.28);cursor:grab;
  }
  .grip svg{width:10px;height:16px;stroke:currentColor;stroke-width:2;stroke-linecap:round;fill:none;}
  .glyph-pick{
    width:32px;height:32px;border-radius:10px;
    background:var(--inset);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:inset 0 0 0 0.5px var(--hairline-2);
    cursor:pointer;color:var(--ink-2);
    position:relative;
  }
  .glyph-pick svg.icon{width:15px;height:15px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;}
  .glyph-pick .chev-down{
    position:absolute;right:2px;bottom:1px;
    width:7px;height:7px;color:var(--label);
  }
  .glyph-pick .chev-down svg{width:100%;height:100%;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;fill:none;}
  .thread-input{
    flex:1;min-width:0;
    background:transparent;border:0;outline:0;
    font:inherit;
    font-size:14.5px;font-weight:600;color:var(--ink);
    letter-spacing:-0.022em;line-height:1.2;
    padding:8px 0;
  }
  .thread-input::placeholder{color:var(--label);font-weight:500;}
  .row-remove{
    width:24px;height:24px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;color:var(--label);cursor:pointer;
    background:transparent;
  }
  .row-remove:hover{background:var(--inset);color:var(--red);}
  .row-remove svg{width:11px;height:11px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;fill:none;}

  .add-thread{
    margin-top:10px;
    width:100%;
    background:transparent;
    border:1px dashed rgba(60,60,67,0.22);
    border-radius:14px;
    padding:11px 14px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    color:var(--label-2);
    font-size:13px;font-weight:600;letter-spacing:-0.014em;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .add-thread:hover{background:rgba(255,255,255,0.5);border-color:rgba(60,60,67,0.34);color:var(--ink-2);}
  .add-thread svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none;}

  /* ───── delete (only on edit) ───── */
  .delete-row{
    display:flex;align-items:center;justify-content:center;
    background:transparent;
    margin:24px 0 4px;padding:10px 0;
    font-size:13.5px;font-weight:500;color:var(--red);
    letter-spacing:-0.014em;
    cursor:pointer;border:0;width:100%;
    gap:6px;
  }
  .delete-row svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;}

  /* ───── floating save dock ───── */
  .save-dock{
    position:absolute;left:0;right:0;bottom:0;
    padding:14px 20px 26px;
    background:linear-gradient(180deg, rgba(242,242,247,0) 0%, rgba(242,242,247,0.85) 35%, rgba(242,242,247,0.98) 100%);
    z-index:6;
    display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  .save-pill{
    width:100%;
    padding:15px 0;
    border-radius:20px;border:0;cursor:pointer;
    background:var(--ink);
    color:#fff;
    font-size:15.5px;font-weight:600;letter-spacing:-0.022em;
    position:relative;
    display:flex;align-items:center;justify-content:center;gap:9px;
    box-shadow:
      0 0 0 0.5px rgba(0,0,0,0.5),
      0 12px 28px -10px rgba(0,0,0,0.45),
      0 4px 10px -6px rgba(20,20,30,0.20),
      inset 0 1px 0 rgba(255,255,255,0.10);
  }
  .save-pill::before{
    content:"";position:absolute;inset:0;border-radius:20px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.12), inset 0 0 0 0.5px rgba(255,255,255,0.06);
    pointer-events:none;
  }
  .save-pill svg{width:14px;height:14px;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none;}

</style>
</head>
<body>

<div class="phone">
  <div class="screen">

    <!-- topbar -->
    <div class="topbar">
      <div class="back">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </div>
      <div class="top-title">Edit vision</div>
    </div>

    <div class="scroll">

      <!-- preview eyebrow -->
      <div class="preview-eyebrow">
        <span class="lbl">How it'll look</span>
        <span class="rule"></span>
        <span class="meta"><span class="dot"></span>live</span>
      </div>

      <!-- LIVE PREVIEW TILE — mirrors VISIONS hero -->
      <div class="preview-tile" id="preview">
        <div class="aura"></div>
        <div class="aura-2"></div>

        <div class="preview-top">
          <span class="preview-pin">
            <svg viewBox="0 0 24 24"><path d="M12 21s-7-6-7-12a7 7 0 1114 0c0 6-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
            Business
          </span>
          <span class="live-tag"><span class="pulse"></span>preview</span>
        </div>

        <div class="preview-body">
          <div class="ddisc">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="7" width="18" height="13" rx="2.2"/>
              <path d="M9 7V5.5A1.5 1.5 0 0110.5 4h3A1.5 1.5 0 0115 5.5V7"/>
              <path d="M3 13h18"/>
            </svg>
          </div>
          <div class="preview-text">
            <div class="preview-title">Webuild</div>
            <div class="preview-tag">Site shop that runs itself.</div>
          </div>
        </div>
      </div>

      <!-- TITLE -->
      <div class="field-label"><span>Title</span></div>
      <div class="title-field">
        <input type="text" value="Webuild" placeholder="Name your vision"/>
        <span class="caret"></span>
      </div>

      <!-- TAGLINE -->
      <div class="field-label"><span>Tagline</span><span class="hint"><span class="num">5</span> / 8 words</span></div>
      <div class="tag-field">
        <input type="text" value="Site shop that runs itself." placeholder="One line. The feeling, not the plan."/>
      </div>

      <!-- DOMAIN PICKER -->
      <div class="field-label"><span>Domain</span><span class="hint">Business</span></div>
      <div class="domain-row">
        <div class="dchip business selected">
          <div class="ddot">
            <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2.2"/><path d="M9 7V5.5A1.5 1.5 0 0110.5 4h3A1.5 1.5 0 0115 5.5V7"/><path d="M3 13h18"/></svg>
          </div>
          <div class="dname">Biz</div>
        </div>
        <div class="dchip religion">
          <div class="ddot">
            <svg viewBox="0 0 24 24"><path d="M16.5 14.8a6.4 6.4 0 11-7.3-9.6 5.2 5.2 0 007.3 9.6z"/></svg>
          </div>
          <div class="dname">Deen</div>
        </div>
        <div class="dchip learning">
          <div class="ddot">
            <svg viewBox="0 0 24 24"><path d="M3 9.5l9-4.5 9 4.5-9 4.5-9-4.5z"/><path d="M7 11.2v4.3c0 1.4 2.3 2.5 5 2.5s5-1.1 5-2.5v-4.3"/><path d="M21 9.5v5"/></svg>
          </div>
          <div class="dname">Mind</div>
        </div>
        <div class="dchip fitness">
          <div class="ddot">
            <svg viewBox="0 0 24 24"><path d="M6 9v6M3 10.5v3M18 9v6M21 10.5v3"/><rect x="6" y="9" width="12" height="6" rx="1.2"/></svg>
          </div>
          <div class="dname">Body</div>
        </div>
        <div class="dchip home">
          <div class="ddot">
            <svg viewBox="0 0 24 24"><path d="M3.5 11l8.5-7 8.5 7"/><path d="M5.5 9.7V20h13V9.7"/><path d="M10 20v-5h4v5"/></svg>
          </div>
          <div class="dname">Home</div>
        </div>
      </div>

      <!-- DESCRIPTION -->
      <div class="field-label"><span>The long view</span><span class="hint">why it matters</span></div>
      <div class="desc-field">
        <textarea placeholder="What is this vision really about? Write to your future self.">A site shop that ships fast, beautiful, near-free websites to founders and small teams—powered by templates, lead gen, and a closing pipeline that quietly compounds in the background.</textarea>
        <div class="meter"><span class="num">214</span>&nbsp;/ 500</div>
      </div>

      <!-- THREADS -->
      <div class="field-label"><span>Threads</span><span class="hint"><span class="num">4</span> parts · drag to reorder</span></div>
      <div class="threads-list">

        <div class="thread-row">
          <div class="grip"><svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg></div>
          <div class="glyph-pick" title="Pick glyph">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/></svg>
            <span class="chev-down"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>
          </div>
          <input class="thread-input" type="text" value="Templates engine"/>
          <div class="row-remove"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
        </div>

        <div class="thread-row">
          <div class="grip"><svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg></div>
          <div class="glyph-pick" title="Pick glyph">
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 18l5-5 4 4 7-9"/><path d="M14 8h6v6"/></svg>
            <span class="chev-down"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>
          </div>
          <input class="thread-input" type="text" value="Lead generation"/>
          <div class="row-remove"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
        </div>

        <div class="thread-row">
          <div class="grip"><svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg></div>
          <div class="glyph-pick" title="Pick glyph">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 7l9 6 9-6"/><rect x="3" y="6" width="18" height="13" rx="2"/></svg>
            <span class="chev-down"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>
          </div>
          <input class="thread-input" type="text" value="Cold email automation"/>
          <div class="row-remove"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
        </div>

        <div class="thread-row">
          <div class="grip"><svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg></div>
          <div class="glyph-pick" title="Pick glyph">
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M6 6v6a6 6 0 0012 0V6"/><path d="M9 21h6"/><path d="M12 18v3"/></svg>
            <span class="chev-down"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>
          </div>
          <input class="thread-input" type="text" value="Closing pipeline"/>
          <div class="row-remove"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
        </div>

      </div>

      <button class="add-thread">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Add thread
      </button>

      <!-- DELETE (only on edit) -->
      <button class="delete-row">
        <svg viewBox="0 0 24 24"><path d="M5 7h14"/><path d="M9 7V5a1.5 1.5 0 011.5-1.5h3A1.5 1.5 0 0115 5v2"/><path d="M7 7l1 12a2 2 0 002 2h4a2 2 0 002-2l1-12"/></svg>
        Delete vision
      </button>

    </div>

    <!-- save dock — pinned -->
    <div class="save-dock">
      <button class="save-pill">
        <svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-11"/></svg>
        Save vision
      </button>
      <button class="cancel-link" style="padding:4px 8px;">Cancel</button>
    </div>

  </div>
</div>

</body>
</html>
