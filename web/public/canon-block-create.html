<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Do It — ADD BLOCK</title>
<style>
  :root{
    --bg:#FFFFFF;
    --stage:#F2F2F7;
    --inset:#F2F2F7;
    --inset-2:#EAEAEF;
    --card:#FFFFFF;

    --ink:#000000;
    --ink-2:#1C1C1E;
    --ink-3:#3A3A3C;
    --label:#8E8E93;
    --label-2:#6E6E73;
    --glyph:#0A0A0F;

    --hairline:rgba(60,60,67,0.10);
    --hairline-2:rgba(60,60,67,0.06);
    --hairline-strong:rgba(60,60,67,0.18);

    --blue:#007AFF;
    --blue-deep:#0062CC;
    --blue-soft:rgba(0,122,255,0.10);

    --mint:#34C7A8;
    --mint-deep:#1E8C77;
    --pink:#F25B8A;
    --pink-deep:#C73E6B;

    --gap:14px;

    --shadow-row:
      0 0 0 0.5px rgba(60,60,67,0.05),
      0 1px 1px rgba(20,20,30,0.02),
      0 6px 16px -12px rgba(20,20,30,0.10);
    --shadow-sheet:
      0 -1px 0 rgba(255,255,255,0.95) inset,
      0 0 0 0.5px rgba(60,60,67,0.08),
      0 -2px 8px rgba(20,20,30,0.04),
      0 -22px 60px -10px rgba(20,20,30,0.20),
      0 -40px 80px -20px rgba(20,20,30,0.22);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
  html,body{
    background:var(--stage);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
    color:var(--ink);
    text-rendering:optimizeLegibility;
  }
  body{
    min-height:100vh;
    display:flex;align-items:flex-start;justify-content:center;
    padding:64px 40px 96px;
    background:radial-gradient(60% 40% at 50% 0%, #F7F7FB 0%, var(--stage) 60%);
  }

  .phone{
    width:393px;height:852px;
    background:var(--bg);
    border-radius:52px;
    position:relative;overflow:hidden;
    box-shadow:
      0 0 0 0.5px rgba(0,0,0,0.06),
      0 1px 0 rgba(255,255,255,0.6) inset,
      0 30px 60px -25px rgba(20,20,30,0.22),
      0 12px 24px -10px rgba(20,20,30,0.10);
  }

  /* ───── BEHIND TODAY (faint hint) ───── */
  .behind{
    position:absolute;inset:0;
    padding:54px 20px 0;
    display:flex;flex-direction:column;
  }
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 4px;margin-bottom:18px;}
  .greet-day{font-size:11.5px;font-weight:600;color:var(--label);letter-spacing:0.04em;}
  .greet-name{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:-0.035em;line-height:1.05;margin-top:3px;}
  .greet-name .sub{color:var(--label);font-weight:500;letter-spacing:-0.022em;}
  .me-avatar{
    width:42px;height:42px;border-radius:50%;
    background:#F2F2F7;display:flex;align-items:center;justify-content:center;overflow:hidden;
    box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(60,60,67,0.10),0 2px 6px rgba(20,20,30,0.10);
  }
  .me-avatar img{width:100%;height:100%;object-fit:cover;display:block;}

  .summary{
    margin:0 4px 22px;
    padding:13px 16px;background:var(--card);border-radius:20px;
    box-shadow:0 0 0 0.5px rgba(60,60,67,0.05),0 8px 22px -14px rgba(20,20,30,0.12);
    display:flex;align-items:center;gap:14px;
  }
  .sum-stat{display:flex;flex-direction:column;gap:3px;}
  .sum-num{font-size:17px;font-weight:700;letter-spacing:-0.026em;line-height:1;font-variant-numeric:tabular-nums;}
  .sum-num .unit{font-weight:600;color:var(--label-2);font-size:11.5px;margin-right:3px;}
  .sum-lbl{font-size:10px;font-weight:700;color:var(--label);letter-spacing:0.10em;text-transform:uppercase;}
  .sum-divider{width:1px;align-self:stretch;background:var(--hairline-2);margin:4px 4px;}
  .sum-track{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
  .sum-track .line{font-size:11px;color:var(--label-2);font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  .sum-track .line .dot{width:5px;height:5px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px rgba(52,199,168,0.14);}
  .sum-track .bar{width:108px;height:4px;border-radius:999px;background:var(--inset-2);overflow:hidden;}
  .sum-track .bar i{display:block;height:100%;background:linear-gradient(90deg,#1C1C1E 0%, #3A3A3C 100%);border-radius:999px;}

  .section-eyebrow{display:flex;align-items:center;gap:8px;padding:0 6px;margin:4px 0 var(--gap);}
  .section-eyebrow .lbl{font-size:10.5px;font-weight:700;color:var(--label);letter-spacing:0.14em;text-transform:uppercase;}
  .section-eyebrow .rule{flex:1;height:1px;background:var(--hairline-2);}

  .ghost-row{
    height:60px;background:var(--card);border-radius:20px;
    margin:0 4px 12px;
    box-shadow:var(--shadow-row);
  }

  /* scrim */
  .scrim{
    position:absolute;inset:0;z-index:5;
    background:rgba(18,18,24,0.34);
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
  }

  /* ───── SHEET ───── */
  .sheet{
    position:absolute;left:0;right:0;bottom:0;
    z-index:10;
    background:#FFFFFF;
    border-top-left-radius:32px;border-top-right-radius:32px;
    padding:10px 22px 22px;
    box-shadow:var(--shadow-sheet);
  }
  .sheet::before{
    content:"";position:absolute;inset:0;
    border-top-left-radius:32px;border-top-right-radius:32px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.95);
    pointer-events:none;
  }
  .handle{
    width:38px;height:5px;border-radius:999px;
    background:rgba(60,60,67,0.22);
    margin:0 auto 14px;
  }
  .eyebrow{
    font-size:10.5px;font-weight:700;color:var(--label);
    letter-spacing:0.14em;text-transform:uppercase;
    text-align:center;
    margin-bottom:14px;
  }

  /* TITLE INPUT */
  .title-field{
    padding:6px 4px 16px;
    border-bottom:0.5px solid var(--hairline-2);
    margin-bottom:18px;
    display:flex;align-items:center;gap:6px;
  }
  .title-field input{
    flex:1;background:transparent;border:0;outline:0;
    font:inherit;
    font-size:24px;font-weight:700;color:var(--ink);letter-spacing:-0.032em;
    line-height:1.1;
  }
  .title-field input::placeholder{color:#C7C7CC;font-weight:600;}
  .title-field .caret{
    width:2px;height:24px;background:var(--blue);
    border-radius:2px;
    animation:blink 1.05s steps(2) infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  /* field label */
  .field-label{
    font-size:10.5px;font-weight:700;color:var(--label);
    letter-spacing:0.14em;text-transform:uppercase;
    padding:0 4px;margin:0 0 10px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .field-label .hint{
    font-size:11.5px;font-weight:600;color:var(--ink-3);
    letter-spacing:-0.012em;text-transform:none;
  }
  .field-label .hint .dom-name{color:var(--ink);font-weight:700;}

  /* DOMAIN DISC PICKER */
  .disc-row{
    display:flex;justify-content:space-between;gap:8px;
    padding:2px 2px 6px;
    margin-bottom:18px;
  }
  .disc-pick{
    width:54px;height:54px;border-radius:50%;
    flex-shrink:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    box-shadow:
      inset 0 0 0 0.5px rgba(20,20,30,0.06),
      inset 0 -3px 6px rgba(20,20,30,0.05),
      0 1px 2px rgba(20,20,30,0.04);
    transition:transform .12s ease;
  }
  .disc-pick svg{
    width:24px;height:24px;color:var(--glyph);
    stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;
  }
  .disc-pick.business{background:linear-gradient(180deg,#E1ECFF 0%, #C9DBFF 100%);}
  .disc-pick.religion{background:linear-gradient(180deg,#D6F2EA 0%, #B8E6D6 100%);}
  .disc-pick.fitness {background:linear-gradient(180deg,#FFD0DA 0%, #FFB6C5 100%);}
  .disc-pick.learning{background:linear-gradient(180deg,#EAE5F4 0%, #D6CCEB 100%);}
  .disc-pick.home    {background:linear-gradient(180deg,#E5ECF0 0%, #CFDCE3 100%);}

  .disc-pick.selected{
    box-shadow:
      0 0 0 2px #fff,
      0 0 0 4px var(--ink-2),
      inset 0 0 0 0.5px rgba(20,20,30,0.06),
      inset 0 -3px 6px rgba(20,20,30,0.05);
    transform:scale(1.04);
  }

  /* DURATION SEGMENTED */
  .seg{
    display:flex;gap:5px;
    background:var(--inset);
    border-radius:14px;
    padding:5px;
    box-shadow:inset 0 0 0 0.5px var(--hairline-2);
    margin-bottom:18px;
  }
  .seg .chip{
    flex:1;
    padding:10px 4px;
    border-radius:10px;
    font-size:13px;font-weight:600;
    color:var(--label-2);
    text-align:center;letter-spacing:-0.014em;
    cursor:pointer;
    background:transparent;
    transition:all .15s ease;
    font-variant-numeric:tabular-nums;
  }
  .seg .chip .u{font-size:10.5px;color:var(--label);font-weight:600;margin-left:2px;}
  .seg .chip.on{
    background:#fff;
    color:var(--ink);
    box-shadow:
      0 0 0 0.5px rgba(60,60,67,0.06),
      0 1px 2px rgba(20,20,30,0.06),
      0 4px 10px -6px rgba(20,20,30,0.10);
  }
  .seg .chip.on .u{color:var(--label-2);}
  .seg .chip.custom{
    display:flex;align-items:center;justify-content:center;gap:4px;
  }
  .seg .chip.custom svg{width:11px;height:11px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;fill:none;display:inline-block;vertical-align:middle;}

  /* SCHEDULE PILLS */
  .when-row{
    display:flex;gap:10px;
    margin-bottom:16px;
  }
  .when-pill{
    flex:1;
    padding:14px 14px;
    border-radius:16px;
    background:var(--inset);
    box-shadow:inset 0 0 0 0.5px var(--hairline-2);
    display:flex;align-items:center;gap:10px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .when-pill .ico{
    width:30px;height:30px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    background:#fff;
    box-shadow:inset 0 0 0 0.5px rgba(60,60,67,0.08), 0 1px 1px rgba(20,20,30,0.03);
    color:var(--ink-3);
    flex-shrink:0;
  }
  .when-pill .ico svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;}
  .when-pill .body{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .when-pill .ttl{font-size:14px;font-weight:600;color:var(--ink-2);letter-spacing:-0.018em;line-height:1.1;}
  .when-pill .sub{font-size:10.5px;font-weight:600;color:var(--label);letter-spacing:0.04em;text-transform:uppercase;}

  .when-pill.on{
    background:#fff;
    box-shadow:
      0 0 0 1.5px var(--ink-2),
      0 8px 18px -10px rgba(20,20,30,0.20),
      0 2px 6px -3px rgba(20,20,30,0.10);
  }
  .when-pill.on .ico{
    background:var(--ink-2);
    color:#fff;
    box-shadow:0 2px 6px -2px rgba(20,20,30,0.30);
  }

  /* NOTES collapsed row */
  .notes-row{
    display:flex;align-items:center;
    background:var(--inset);
    border-radius:14px;
    padding:12px 14px;
    box-shadow:inset 0 0 0 0.5px var(--hairline-2);
    margin-bottom:18px;
    cursor:pointer;
    gap:10px;
  }
  .notes-row .pencil{
    width:26px;height:26px;border-radius:8px;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 0 0.5px rgba(60,60,67,0.08);
    color:var(--label-2);
    flex-shrink:0;
  }
  .notes-row .pencil svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;}
  .notes-row .lbl{
    font-size:13.5px;font-weight:500;color:var(--label);letter-spacing:-0.014em;
  }
  .notes-row .add{
    margin-left:auto;
    font-size:11.5px;font-weight:700;color:var(--label-2);
    letter-spacing:0.06em;text-transform:uppercase;
  }

  /* SAVE pill — black, per brief */
  .save-pill{
    width:100%;
    padding:16px 0;
    border-radius:18px;border:0;cursor:pointer;
    background:linear-gradient(180deg,#1C1C1E 0%, #000000 100%);
    box-shadow:
      0 0 0 0.5px rgba(0,0,0,0.40),
      0 14px 28px -12px rgba(20,20,30,0.50),
      0 6px 12px -6px rgba(20,20,30,0.30);
    color:#fff;
    font-size:15.5px;font-weight:700;letter-spacing:-0.022em;
    position:relative;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .save-pill::before{
    content:"";position:absolute;inset:0;border-radius:18px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.12), inset 0 0 0 0.5px rgba(255,255,255,0.06);
    pointer-events:none;
  }
  .save-pill svg{width:14px;height:14px;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none;}

  .cancel{
    display:block;width:100%;
    padding:14px 0 2px;
    text-align:center;
    font-size:14px;font-weight:500;color:var(--label-2);letter-spacing:-0.018em;
    background:none;border:0;cursor:pointer;
  }
</style>
</head>
<body>

<div class="phone">

  <!-- ───── BEHIND ───── -->
  <div class="behind">
    <div class="topbar">
      <div>
        <div class="greet-day">Wed · 9:42</div>
        <div class="greet-name">Today <span class="sub">· calmly on track</span></div>
      </div>
      <div class="me-avatar">
        <img src="https://www.tapback.co/api/avatar/jay.webp?color=7" alt="Adam"/>
      </div>
    </div>

    <div class="summary">
      <div class="sum-stat">
        <div class="sum-num">1<span class="unit">h</span>00<span class="unit">m</span></div>
        <div class="sum-lbl">Done</div>
      </div>
      <div class="sum-divider"></div>
      <div class="sum-stat">
        <div class="sum-num">3<span class="unit">h</span>40<span class="unit">m</span></div>
        <div class="sum-lbl">Ahead</div>
      </div>
      <div class="sum-track">
        <div class="line"><span class="dot"></span> 6 blocks · 1 anchor</div>
        <div class="bar"><i style="width:21%"></i></div>
      </div>
    </div>

    <div class="section-eyebrow">
      <span class="lbl">The day</span>
      <span class="rule"></span>
    </div>
    <div class="ghost-row"></div>
    <div class="ghost-row"></div>
    <div class="ghost-row"></div>
  </div>

  <!-- ───── SCRIM ───── -->
  <div class="scrim"></div>

  <!-- ───── SHEET ───── -->
  <div class="sheet">
    <div class="handle"></div>
    <div class="eyebrow">New block</div>

    <!-- TITLE -->
    <div class="title-field">
      <input type="text" placeholder="What are you doing?" value="" />
      <span class="caret"></span>
    </div>

    <!-- DOMAIN -->
    <div class="field-label">
      <span>Domain</span>
      <span class="hint"><span class="dom-name">Business</span></span>
    </div>
    <div class="disc-row">
      <div class="disc-pick business selected" title="Business">
        <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2.2"/><path d="M9 7V5.5A1.5 1.5 0 0110.5 4h3A1.5 1.5 0 0115 5.5V7"/><path d="M3 13h18"/></svg>
      </div>
      <div class="disc-pick religion" title="Religion">
        <svg viewBox="0 0 24 24"><path d="M16.5 14.8a6.4 6.4 0 11-7.3-9.6 5.2 5.2 0 007.3 9.6z"/><path d="M17.5 5l.5 1.4 1.5.2-1.1 1 .3 1.4-1.2-.7-1.2.7.3-1.4-1.1-1 1.5-.2z"/></svg>
      </div>
      <div class="disc-pick fitness" title="Fitness">
        <svg viewBox="0 0 24 24"><path d="M6 9v6M3 10.5v3M18 9v6M21 10.5v3"/><rect x="6" y="9" width="12" height="6" rx="1.2"/></svg>
      </div>
      <div class="disc-pick learning" title="Learning">
        <svg viewBox="0 0 24 24"><path d="M3 8l9-4 9 4-9 4-9-4z"/><path d="M7 10v5c0 1.5 2.2 3 5 3s5-1.5 5-3v-5"/></svg>
      </div>
      <div class="disc-pick home" title="Home">
        <svg viewBox="0 0 24 24"><path d="M3.5 11l8.5-7 8.5 7"/><path d="M5.5 9.7V20h13V9.7"/><path d="M10 20v-5h4v5"/></svg>
      </div>
    </div>

    <!-- DURATION -->
    <div class="field-label">
      <span>Duration</span>
      <span class="hint"><span class="dom-name">30 min</span></span>
    </div>
    <div class="seg">
      <div class="chip">15<span class="u">m</span></div>
      <div class="chip on">30<span class="u">m</span></div>
      <div class="chip">45<span class="u">m</span></div>
      <div class="chip">60<span class="u">m</span></div>
      <div class="chip">90<span class="u">m</span></div>
      <div class="chip custom">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </div>

    <!-- WHEN -->
    <div class="field-label"><span>Schedule</span></div>
    <div class="when-row">
      <div class="when-pill on">
        <div class="ico">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        </div>
        <div class="body">
          <div class="ttl">Today</div>
          <div class="sub">Wed · now</div>
        </div>
      </div>
      <div class="when-pill">
        <div class="ico">
          <svg viewBox="0 0 24 24"><path d="M5 9l7-5 7 5"/><path d="M5 9v10h14V9"/><path d="M9 19v-5h6v5"/></svg>
        </div>
        <div class="body">
          <div class="ttl">Tomorrow</div>
          <div class="sub">Thu · 6 May</div>
        </div>
      </div>
    </div>

    <!-- NOTES -->
    <div class="notes-row">
      <div class="pencil">
        <svg viewBox="0 0 24 24"><path d="M5 19l4-1 9-9-3-3-9 9-1 4z"/></svg>
      </div>
      <div class="lbl">Add a note</div>
      <div class="add">+ Add</div>
    </div>

    <!-- SAVE -->
    <button class="save-pill">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      Add block
    </button>

    <button class="cancel">Cancel</button>
  </div>

</div>

</body>
</html>
