<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Do It — Splash</title>
<style>
  :root{
    --bg:#FFFFFF;
    --stage:#F2F2F7;
    --ink:#000000;
    --label:#8E8E93;
    --label-2:#6E6E73;
    --hairline:rgba(60,60,67,0.10);
    --blue:#007AFF;
    --green:#34C759;
    --green-soft:rgba(52,199,89,0.14);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
  html,body{
    background:var(--stage);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
    color:var(--ink);
    text-rendering:optimizeLegibility;
  }
  body{
    min-height:100vh;
    display:flex;align-items:flex-start;justify-content:center;
    padding:64px 40px 96px;
    background:radial-gradient(60% 40% at 50% 0%, #F7F7FB 0%, var(--stage) 60%);
  }

  .col{display:flex;flex-direction:column;align-items:center;gap:18px;}
  .col-label{
    font-size:11px;letter-spacing:0.18em;text-transform:uppercase;
    color:#8E8E93;font-weight:600;
  }

  /* phone shell */
  .phone{
    width:393px;height:852px;
    background:var(--bg);
    border-radius:52px;
    position:relative;overflow:hidden;
    box-shadow:
      0 0 0 0.5px rgba(0,0,0,0.06),
      0 1px 0 rgba(255,255,255,0.6) inset,
      0 30px 60px -25px rgba(20,20,30,0.22),
      0 12px 24px -10px rgba(20,20,30,0.10);
  }
  .screen{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:0 24px;
  }

  /* ambient halo behind orb — the same blue light that lives across the app */
  .halo{
    position:absolute;
    top:50%;left:50%;
    width:760px;height:760px;
    transform:translate(-50%,-58%);
    background:
      radial-gradient(closest-side, rgba(0,122,255,0.08) 0%, rgba(0,122,255,0.025) 38%, transparent 68%),
      radial-gradient(closest-side at 60% 40%, rgba(180,210,255,0.22) 0%, transparent 55%);
    pointer-events:none;
    animation:breathe 5.5s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{opacity:0.85;transform:translate(-50%,-58%) scale(1);}
    50%    {opacity:1;   transform:translate(-50%,-58%) scale(1.04);}
  }

  /* the signature orb */
  .stage{
    position:relative;z-index:2;
    display:flex;flex-direction:column;
    align-items:center;
    margin-top:-60px; /* optical center, slightly above middle */
  }
  .orb{
    width:208px;height:208px;border-radius:50%;
    position:relative;
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.4) 22%, transparent 45%),
      radial-gradient(circle at 50% 60%, #DCEAFC 0%, #C5DCF7 60%, #ABCAF0 100%);
    box-shadow:
      inset 0 -10px 30px rgba(60,90,140,0.18),
      inset 0 2px 0 rgba(255,255,255,0.9),
      0 30px 60px -20px rgba(60,90,140,0.30),
      0 10px 30px -10px rgba(60,90,140,0.18);
    animation:float 5.5s ease-in-out infinite;
  }
  .orb::before{
    content:"";position:absolute;
    top:14%;left:18%;width:38%;height:24%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.85) 0%, transparent 70%);
    filter:blur(2px);
  }
  .orb::after{
    content:"";position:absolute;inset:-26px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(0,122,255,0.10) 0%, transparent 60%);
    z-index:-1;
  }
  @keyframes float{
    0%,100%{transform:translateY(0);}
    50%    {transform:translateY(-6px);}
  }

  /* wordmark */
  .wordmark{
    margin-top:54px;
    font-size:56px;font-weight:800;color:var(--ink);
    letter-spacing:-0.058em;line-height:0.95;
    text-align:center;
  }
  .wordmark .dot{color:var(--blue);}
  .tagline{
    margin-top:12px;
    font-size:16px;font-weight:500;color:var(--label-2);
    letter-spacing:-0.018em;text-align:center;
  }

  /* footer status */
  .status{
    position:absolute;left:0;right:0;bottom:42px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    z-index:2;
  }
  .loading{
    font-size:12px;font-weight:600;
    letter-spacing:0.04em;
    color:var(--label);
    background:linear-gradient(
      90deg,
      rgba(142,142,147,0.55) 0%,
      rgba(142,142,147,0.55) 35%,
      #1C1C1E 50%,
      rgba(142,142,147,0.55) 65%,
      rgba(142,142,147,0.55) 100%
    );
    background-size:240% 100%;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    animation:shimmer 2.4s linear infinite;
  }
  @keyframes shimmer{
    0%  {background-position:120% 0;}
    100%{background-position:-120% 0;}
  }
  .home-bar{
    width:134px;height:5px;border-radius:99px;
    background:rgba(0,0,0,0.85);
  }

  /* version chip — tiny */
  .versionchip{
    position:absolute;left:50%;top:60px;transform:translateX(-50%);
    display:inline-flex;align-items:center;gap:7px;
    font-size:11px;font-weight:600;color:var(--label);
    letter-spacing:0.06em;text-transform:uppercase;
    background:rgba(255,255,255,0.7);
    padding:6px 12px;border-radius:999px;
    box-shadow:
      0 0 0 0.5px var(--hairline),
      0 1px 1px rgba(20,20,30,0.03);
    backdrop-filter:saturate(180%) blur(10px);
    z-index:2;
    opacity:0;
    animation:fadein 1.2s ease 0.1s forwards;
  }
  .versionchip .pip{
    width:6px;height:6px;border-radius:50%;background:var(--green);
    box-shadow:0 0 0 3px var(--green-soft);
  }
  @keyframes fadein{to{opacity:1;}}
</style>
</head>
<body>

<div class="col">
  <div class="col-label">Splash · Launch</div>
  <div class="phone">
    <div class="screen">
      <div class="halo"></div>

      <div class="versionchip">
        <span class="pip"></span>
        Good morning
      </div>

      <div class="stage">
        <div class="orb"></div>
        <div class="wordmark">Do It<span class="dot">.</span></div>
        <div class="tagline">One thing at a time.</div>
      </div>

      <div class="status">
        <div class="loading">LOADING YOUR DAY</div>
        <div class="home-bar"></div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
